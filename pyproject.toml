[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-bitable-bookkeeping-agent"
version = "0.1.0"
description = "飞书记账 Agent 的只读查询最小框架"
requires-python = ">=3.11"
dependencies = [
  "lark-channel-sdk==1.4.0",
  "pydantic-ai-slim[openai]==2.54.0",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[project.scripts]
bookkeeping-agent = "bookkeeping_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
